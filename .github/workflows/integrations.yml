name: Integrations and consumers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libflac-dev libogg-dev libvorbis-dev libfreetype-dev libxinerama-dev libwayland-dev libxkbcommon-dev xvfb
      - run: cmake -S . -B build -DCENTUI_BUILD_EXAMPLES=ON -DCENTUI_BUILD_INTEGRATION_TESTS=ON -DCENTUI_BUILD_SDL=ON -DCENTUI_BUILD_SFML=ON -DCENTUI_BUILD_GLFW=ON -DCENTUI_BUILD_BGFX=ON
      - run: cmake --build build --config Release --parallel 4
      - if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release -L integration --output-on-failure
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
      - if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release -L integration --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
  consumers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [fetchcontent, fetchcontent-git, subdirectory]
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S tests/consumer -B consumer-build -DCENTUI_SOURCE=${{ github.workspace }} -DCONSUMER_MODE=${{ matrix.mode }}
      - run: cmake --build consumer-build --parallel 4
      - run: ctest --test-dir consumer-build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build -DCENTUI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

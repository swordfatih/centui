name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    core-tests:
        name: Core tests / ${{ matrix.name }} / C++20
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux GCC
                      os: ubuntu-24.04
                      cc: gcc-14
                      cxx: g++-14
                      cxxflags: -Wall -Wextra -Wpedantic
                      configure: -G Ninja
                      packages: g++-14
                      build_type: Release

                    - name: Linux Clang
                      os: ubuntu-24.04
                      cc: clang-18
                      cxx: clang++-18
                      cxxflags: -Wall -Wextra -Wpedantic -stdlib=libc++
                      configure: -G Ninja
                      packages: clang-18 libc++-18-dev libc++abi-18-dev
                      build_type: Release

                    - name: macOS Apple Clang
                      os: macos-15
                      cc: clang
                      cxx: clang++
                      cxxflags: -Wall -Wextra -Wpedantic
                      configure: -G Ninja
                      build_type: Release

                    - name: Windows MSVC
                      os: windows-2022
                      cc: cl
                      cxx: cl
                      cxxflags: /W4 /Zc:__cplusplus /utf-8
                      configure: -G "Visual Studio 17 2022" -A x64
                      build_type: Release

                    - name: Windows ClangCL Debug
                      os: windows-2022
                      cc: clang-cl
                      cxx: clang-cl
                      cxxflags: /W4 /Zc:__cplusplus /utf-8
                      configure: -G "Visual Studio 17 2022" -A x64 -T ClangCL
                      build_type: Debug
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Linux build tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y \
                    ninja-build pkg-config ${{ matrix.packages }}

            - name: Configure
              shell: bash
              env:
                  CC: ${{ matrix.cc }}
                  CXX: ${{ matrix.cxx }}
                  CXXFLAGS: ${{ matrix.cxxflags }}
              run: >-
                  cmake -S . -B build ${{ matrix.configure }}
                  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                  -DCMAKE_CXX_STANDARD=20
                  -DCMAKE_CXX_STANDARD_REQUIRED=ON
                  -DCMAKE_CXX_EXTENSIONS=OFF
                  -DCENTUI_BUILD_SDL=OFF
                  -DCENTUI_BUILD_SFML=OFF
                  -DCENTUI_BUILD_GLFW=OFF
                  -DCENTUI_BUILD_BGFX=OFF
                  -DCENTUI_BUILD_EXAMPLES=OFF
                  -DCENTUI_BUILD_TESTS=ON

            - name: Build
              run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

            - name: Test
              run: ctest --test-dir build --build-config ${{ matrix.build_type }} --parallel 4 --output-on-failure --no-tests=error

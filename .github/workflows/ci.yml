name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    core-tests:
        name: Core tests / GCC 16.2 / C++23
        runs-on: ubuntu-latest
        container: gcc:16.2.0
        timeout-minutes: 45

        steps:
            - name: Install checkout dependencies
              run: |
                  apt-get update
                  apt-get install --no-install-recommends -y \
                    ca-certificates git

            - name: Checkout
              uses: actions/checkout@v6

            - name: Install build tools
              run: |
                  apt-get update
                  apt-get install --no-install-recommends -y \
                    ninja-build pkg-config \
                    python3 python3-pip python3-venv

                  python3 -m venv /opt/centui-cmake
                  /opt/centui-cmake/bin/pip install 'cmake>=4.3,<5'
                  echo /opt/centui-cmake/bin >> "$GITHUB_PATH"

                  gcc --version
                  g++ --version

            - name: Configure
              env:
                  CC: gcc
                  CXX: g++
              run: |
                  cmake -S . -B build -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_CXX_STANDARD=23 \
                    -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                    -DCMAKE_CXX_EXTENSIONS=OFF \
                    -DCENTUI_BUILD_SDL=OFF \
                    -DCENTUI_BUILD_SFML=OFF \
                    -DCENTUI_BUILD_GLFW=OFF \
                    -DCENTUI_BUILD_BGFX=OFF \
                    -DCENTUI_BUILD_EXAMPLES=OFF \
                    -DCENTUI_BUILD_TESTS=ON

            - name: Build
              run: cmake --build build --parallel 4

            - name: Test
              run: |
                  ctest --test-dir build \
                    --parallel 4 \
                    --output-on-failure

    clang-core-tests:
        name: Core tests / Clang 23 / C++23
        runs-on: ubuntu-latest
        container: teeks99/clang-ubuntu:23
        timeout-minutes: 45

        steps:
            - name: Install checkout dependencies
              run: |
                  apt-get update
                  apt-get install --no-install-recommends -y \
                    ca-certificates git

            - name: Checkout
              uses: actions/checkout@v6

            - name: Install build tools
              run: |
                  apt-get update
                  apt-get install --no-install-recommends -y \
                    ninja-build pkg-config \
                    python3 python3-pip python3-venv \
                    clang-tools-23 lld-23 \
                    libc++-23-dev libc++abi-23-dev

                  python3 -m venv /opt/centui-cmake
                  /opt/centui-cmake/bin/pip install 'cmake>=4.3,<5'
                  echo /opt/centui-cmake/bin >> "$GITHUB_PATH"

                  clang-23 --version
                  clang++-23 --version

            - name: Configure
              env:
                  CC: clang-23
                  CXX: clang++-23
              run: |
                  cmake -S . -B build -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_CXX_STANDARD=23 \
                    -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                    -DCMAKE_CXX_EXTENSIONS=OFF \
                    -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
                    -DCENTUI_BUILD_SDL=OFF \
                    -DCENTUI_BUILD_SFML=OFF \
                    -DCENTUI_BUILD_GLFW=OFF \
                    -DCENTUI_BUILD_BGFX=OFF \
                    -DCENTUI_BUILD_EXAMPLES=OFF \
                    -DCENTUI_BUILD_TESTS=ON

            - name: Build
              run: cmake --build build --parallel 4

            - name: Test
              run: |
                  ctest --test-dir build \
                    --parallel 4 \
                    --output-on-failure

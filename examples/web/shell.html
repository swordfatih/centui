<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CentUI web example</title>
        <style>
            html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
            canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
            #status { position: fixed; inset: 1rem auto auto 1rem; color: white; font: 14px sans-serif; }
        </style>
    </head>
    <body>
        <canvas id="canvas" tabindex="0" aria-label="CentUI interactive example"></canvas>
        <div id="status" role="status">Loading CentUI…</div>
        <script>
            var Module = {
                canvas: document.getElementById('canvas'),
                onRuntimeInitialized() {
                    document.getElementById('status').hidden = true;
                    Module.canvas.focus();
                },
                onAbort(message) {
                    const status = document.getElementById('status');
                    status.hidden = false;
                    status.textContent = 'CentUI failed to start. See the browser console.';
                    console.error(message);
                }
            };
        </script>
        {{{ SCRIPT }}}
    </body>
</html>
